name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 0 * * *'   # every day, about 06:00 IST: refreshes the daily reading list
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Builds js/content.js and js/posts.js from content/, then writes your content into index.html so search engines can read it. Only changes the deployed copy.
      - name: Prerender content for search engines
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          npm install --no-save --no-package-lock jsdom js-yaml
          node tools/build-data.js
          node tools/fetch-feed.js || echo 'feed fetch failed, using the saved list'
          node tools/prerender.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
